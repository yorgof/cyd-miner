name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hashing and Stratum job self-test
        run: |
          gcc -O2 -Wall -Wextra -Imain -o host_test test/host_test.c main/sha256.c main/work.c
          ./host_test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the example settings
        run: cp main/settings.example.h main/settings.h
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32
